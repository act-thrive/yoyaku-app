<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>予約表</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.56.0/dist/umd/supabase.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F8F7;--sf:#fff;--ink:#1B2928;--mut:#5E706D;--line:#D3DDDA;--pri:#1F6F66;--pi:#fff;--hi:#FFF1CF;--hl:#E0A431;--bk:#DDEBE8;--bad:#B5483A;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121A19;--sf:#1A2524;--ink:#E6EEEC;--mut:#9BB0AC;--line:#2E3F3D;--pri:#4FB3A6;--pi:#0B1413;--hi:#3A2F12;--bk:#21393A;--bad:#E07A6B;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121A19;--sf:#1A2524;--ink:#E6EEEC;--mut:#9BB0AC;--line:#2E3F3D;--pri:#4FB3A6;--pi:#0B1413;--hi:#3A2F12;--bk:#21393A;--bad:#E07A6B;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.6 "Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",Meiryo,sans-serif}
main{max-width:1000px;margin:0 auto;padding:12px 14px 40px}
h1{font-size:20px;margin:0}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--hl);outline-offset:2px}
.top,.bar,.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.top{justify-content:space-between;margin-bottom:4px}
.note{color:var(--mut);font-size:13px;margin:0 0 10px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--sf);padding:10px 18px;min-height:44px}
.seg button[aria-pressed=true]{background:var(--pri);color:var(--pi);font-weight:700}
.bar{margin:8px 0}
.bar select,.btn,#q,.fi{min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--sf);padding:6px 12px}
.btn.p{background:var(--pri);color:var(--pi);border-color:var(--pri);font-weight:700}
.btn.d{color:var(--bad)}
#dl{min-width:9.5em;text-align:center}
#q{width:100%;max-width:420px}
#sug{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.panel{background:var(--sf);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0}
.panel p{margin:4px 0 0;color:var(--mut);font-size:13px}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--sf)}
.tt{display:grid;min-width:max-content;width:100%}
.hd{font-weight:700;text-align:center;padding:8px 4px;border-bottom:1px solid var(--line);background:var(--sf)}
.tm{font-size:12px;color:var(--mut);padding:8px 6px 0;border-top:1px solid var(--line);height:40px;box-sizing:border-box}
.tt button,.cl{height:40px;box-sizing:border-box;border:0;border-top:1px solid var(--line);border-left:1px solid var(--line);margin:0;border-radius:0;font-size:14px}
.em{background:var(--sf)}
.em:hover{background:var(--hi)}
.bk{background:var(--bk);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px}
.bk.on{background:var(--hi);box-shadow:inset 0 0 0 2px var(--hl)}
.cl{background:var(--bg);color:var(--mut);font-size:12px;text-align:center;padding-top:10px}
.st{margin:14px 0;background:var(--sf);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.st h2{font-size:17px;margin:0 0 6px;display:flex;justify-content:space-between;gap:8px}
.meter{height:6px;background:var(--bk);border-radius:3px;overflow:hidden;margin-bottom:8px}
.meter i{display:block;height:100%;background:var(--pri)}
.st ul{list-style:none;margin:0;padding:0}
.st li{display:flex;gap:12px;padding:5px 0;border-top:1px solid var(--line)}
.st li span:first-child{min-width:3.4em;color:var(--mut)}
.st li span:nth-child(2){min-width:4em}
.empty{color:var(--mut)}
.cfg{margin-top:10px;border-top:1px solid var(--line);padding-top:4px}
.cfg summary{cursor:pointer;min-height:44px;display:flex;align-items:center}
.cfg label{display:inline-flex;align-items:center;gap:4px;min-height:36px}
.cfg select{min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--sf);padding:6px 12px}
.wk{border-collapse:collapse;width:100%;min-width:640px}
.wk th,.wk td{border-top:1px solid var(--line);border-left:1px solid var(--line);padding:8px 6px;text-align:center;font-size:14px}
.wk tr:first-child th{border-top:0}.wk th:first-child,.wk td:first-child{border-left:0}
.wk th{font-weight:700}.wk .meter{margin:4px 0 0}
.cx{color:var(--mut);background:var(--bg)}
.lnk{border:0;background:none;color:var(--pri);font-weight:700;min-height:44px;text-decoration:underline}
.sheet button,.sheet .cl,.sheet .tm{height:48px}
.qc{display:grid;grid-template-rows:1fr 1fr;height:48px;box-sizing:border-box;border-top:1px solid var(--line);border-left:1px solid var(--line)}
.sheet .qc button,.sheet .qc .cl{height:auto;border:0;border-top:1px dashed var(--line);font-size:11px;padding:0 3px;overflow:hidden}
.sheet .qc>:first-child{border-top:0}
.bk{position:relative}
.bk .nm{padding-right:14px}
.nm.nw{color:var(--bad)}
.nm.kc{box-shadow:0 0 0 2px #E8C53A;border-radius:10px;padding:0 5px}
.nm.jh{text-decoration:underline;text-decoration-color:#4BA3D9;text-decoration-thickness:3px;text-underline-offset:3px}
.bk i{position:absolute;right:3px;font-style:normal;font-size:10px;line-height:1;color:var(--bad)}
.bk i.rs{top:2px}.bk i.hr{bottom:2px}
.chk{display:inline-flex;align-items:center;gap:4px;min-height:44px}
.chk input{width:20px;height:20px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
[hidden]{display:none!important}
#login{max-width:420px;margin:48px auto}
#login .fi{width:100%;box-sizing:border-box}
#lerr{color:var(--bad);min-height:1.4em}
</style>
</head>
<body>
<section id="login" class="panel" hidden>
<h1>予約表</h1><p class="note">スタッフ用のメールアドレスとパスワードでログインしてください。</p>
<form id="lform"><label>メールアドレス<br><input id="le" type="email" class="fi" autocomplete="username" required></label><br><br>
<label>パスワード<br><input id="lp" type="password" class="fi" autocomplete="current-password" required></label>
<p id="lerr" role="alert"></p><button class="btn p" type="submit" id="lgo">ログイン</button></form></section>
<main id="app" hidden>
<div class="top"><h1>予約表</h1>
<div class="row"><button class="btn" id="logout">ログアウト</button><div class="seg" id="roleSeg"><button data-role="staff" aria-pressed="true">受付</button><button data-role="admin" aria-pressed="false">管理者</button></div></div></div>
<p class="note" id="mode">共有の保存先に接続しています…</p>
<div class="bar">
<label id="storeWrap">店舗 <select id="myStore"></select></label>
<div class="row"><button class="btn" id="prev" aria-label="前の日">‹</button><strong id="dl"></strong><button class="btn" id="next" aria-label="次の日">›</button><button class="btn" id="today">今日</button></div>
<div class="seg" id="vseg"><button data-view="day" aria-pressed="true">日</button><button data-view="week" aria-pressed="false">週</button></div>
<label id="wsWrap" hidden>スタッフ <select id="wst"></select></label>
</div>
<section id="staffView">
<input id="q" placeholder="名前・ひらがな・フリガナ・管理番号で探す" autocomplete="off" aria-label="患者さんを探す">
<div class="row" style="margin:6px 0"><label class="btn" style="display:inline-flex;align-items:center;cursor:pointer">患者データを取り込む（CSV）<input id="csv" type="file" accept=".csv,text/csv" hidden></label><button class="btn" id="newbtn">＋ 新規の患者さんを登録</button><button class="btn" id="plbtn">患者一覧</button><button class="btn" id="stbtn">スタッフの追加・削除</button><button class="btn" id="absbtn">スタッフの欠勤を設定</button></div>
<p class="note" style="margin:0 0 6px">メープルのCSVを読み込むと、この店舗の患者さんとして保存されます。すでにいる方は飛ばされ、新しい方だけが追加されます。（名前などが変わっていれば更新されます）</p>
<div id="nform" class="panel" hidden>
<div class="row"><label>氏名 <input id="nn" class="fi" autocomplete="off"></label><label>フリガナ <input id="nk" class="fi" autocomplete="off"></label><button class="btn p" id="nsave">登録して選ぶ</button><button class="btn" id="ncancel">閉じる</button></div>
<p>登録先の店舗：<span id="nstore"></span>。メープルの管理番号が決まったら、あとから登録して紐づけられます。</p>
</div>
<div id="plist" class="panel" hidden></div>
<div id="stform" class="panel" hidden></div>
<div id="absform" class="panel" hidden></div>
<div id="sug"></div>
<div id="patient"></div>
<div id="detail"></div>
<div class="scroll"><div id="tt" class="tt"></div></div>
<p class="note" style="margin-top:8px">見かた：名前の水色の下線＝実費メニュー、赤い名前＝新規、赤い「レセ」＝今月初診、赤い「ハ」＝鍼、黄色い丸＝実費更新日、↓＝2枠予約</p>
</section>
<section id="adminView" hidden></section>
</main>
<div id="toast" role="status" aria-live="polite"></div>
<script>
const SB_URL='https://gxpnfftlixwyhxafcgdy.supabase.co',SB_KEY='sb_publishable_oOpjTBMdzfZHtumjOdpuIg_w-3uLdep';
const STORES=[];
const ALLT=[];for(let m=420;m<=1260;m+=20)ALLT.push(m);
const ALLT10=[];for(let m=420;m<=1270;m+=10)ALLT10.push(m);
const slotsOf=st=>{const a=[];for(let m=st.first;m<=st.lastPm;m+=20)a.push(m);return a};
const isBreak=(st,m,d)=>(d&&st.half[d.getDay()])?m>st.halfEnd:(m>st.lastAm&&m<st.pm);
const openOf=(st,d)=>slotsOf(st).filter(m=>!isBreak(st,m,d)).length;
const HOL={'2026-01-01':'元日','2026-01-12':'成人の日','2026-02-11':'建国記念の日','2026-02-23':'天皇誕生日','2026-03-20':'春分の日','2026-04-29':'昭和の日','2026-05-03':'憲法記念日','2026-05-04':'みどりの日','2026-05-05':'こどもの日','2026-05-06':'振替休日','2026-07-20':'海の日','2026-08-11':'山の日','2026-09-21':'敬老の日','2026-09-22':'国民の休日','2026-09-23':'秋分の日','2026-10-12':'スポーツの日','2026-11-03':'文化の日','2026-11-23':'勤労感謝の日','2027-01-01':'元日','2027-01-11':'成人の日','2027-02-11':'建国記念の日','2027-02-23':'天皇誕生日','2027-03-21':'春分の日','2027-03-22':'振替休日','2027-04-29':'昭和の日','2027-05-03':'憲法記念日','2027-05-04':'みどりの日','2027-05-05':'こどもの日','2027-07-19':'海の日','2027-08-11':'山の日','2027-09-20':'敬老の日','2027-09-23':'秋分の日','2027-10-11':'スポーツの日','2027-11-03':'文化の日','2027-11-23':'勤労感謝の日'};
const holName=(st,d)=>st.hol&&st.days[d.getDay()]?(HOL[iso(d)]||''):'';
const closedLabel=(st,d)=>holName(st,d)||'休診';
const isOpenDay=(st,d)=>st.days[d.getDay()]&&!holName(st,d);
const timeOpts=sel=>{let o='';ALLT.forEach(m=>{o+='<option value="'+m+'"'+(m===sel?' selected':'')+'>'+fmt(m)+'</option>'});return o};
const cfg=st=>'<details class="cfg" data-d="'+st.id+'"'+(S.cfgOpen[st.id]?' open':'')+'><summary>営業時間・営業日を変更</summary><div class="row" style="margin:6px 0">'+'日月火水木金土'.split('').map((w,i)=>'<label><input type="checkbox" data-c="'+st.id+'" data-f="day'+i+'"'+(st.days[i]?' checked':'')+'> '+w+'</label>').join('')+'<label><input type="checkbox" data-c="'+st.id+'" data-f="hol"'+(st.hol?' checked':'')+'> 祝日は休診</label></div><div class="row" style="margin:6px 0"><span>半日営業の曜日</span>'+'<label>週に1回 <select data-c="'+st.id+'" data-f="halfday">'+'日月火水木金土'.split('').map((w,i)=>'<option value="'+i+'"'+(st.half[i]?' selected':'')+'>'+w+'曜</option>').join('')+'</select></label>'+'</div><div class="row">'+[['first','開始'],['lastAm','午前の最終受付'],['pm','午後の開始'],['lastPm','午後の最終受付'],['halfEnd','半日営業の最終受付']].map(([f,l])=>'<label>'+l+' <select data-c="'+st.id+'" data-f="'+f+'">'+timeOpts(st[f])+'</select></label>').join('')+'</div><p class="note" style="margin:6px 0 0">最終受付の時刻の枠も予約できます。変更はこの店舗の受付画面にすぐ反映されます。</p></details>';
const fmt=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);
const sname=id=>(STORES.find(s=>s.id===id)||{name:id}).name;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const P=[];
const B={};
const S={role:'staff',store:'',date:new Date(),pid:null,sel:null,q:'',view:'day',ws:0,cfgOpen:{},mk:{j:0,h:0,r:0,n:0},mode:'loading',admin:false,canW:true,psig:'',rf:'',rt:''};
S.date.setHours(0,0,0,0);
let sb=null,ME=null;
let ABSL=[];const ABS={};
let LU=new Set();
const hid=(st,i)=>!!(st.hid&&st.hid[i]);
const lnm=(st,i)=>st.staff[i]+(hid(st,i)?'（削除済）':'');
function luBuild(){LU=new Set();Object.keys(B).forEach(k=>{if(B[k].cont)return;const q=k.split('|');LU.add(q[1]+'|'+q[0]+'|'+q[2])})}
function lanesFor(st,dates){const out=[];st.staff.forEach((_,i)=>{if(!hid(st,i)||(dates&&dates.some(d=>LU.has(st.id+'|'+(typeof d==='string'?d:iso(d))+'|'+i))))out.push(i)});return out}
function rebuildAbs(){Object.keys(ABS).forEach(k=>delete ABS[k]);ABSL.forEach(a=>{const k=a.store_id+'|'+a.absence_date+'|'+a.lane;(ABS[k]=ABS[k]||{})[a.part]=1})}
function isAbsent(store,d,lane,t,st){
 if(lane==='q')return false;
 const a=ABS[store+'|'+(typeof d==='string'?d:iso(d))+'|'+lane];if(!a)return false;
 return !!(a.all||(a.am&&t<=st.lastAm)||(a.pm&&t>=st.pm));
}
const absCell=(store,d,lane,t,st,extra)=>'<div class="cl"'+(extra||'')+'>'+((t===st.first||t===st.pm||!isAbsent(store,d,lane,t-20,st))?'欠勤':'')+'</div>';
const key=(d,st,s,t)=>iso(d)+'|'+st+'|'+s+'|'+t;
const keyParts=k=>{const a=k.split('|');return {date:a[0],store:a[1],s:a[2],t:+a[3]}};
const sk=(s,t)=>s+'_'+t;
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const pn=pid=>{const p=P.find(x=>x.id===pid);return p?p.n:'（他店舗の患者）'};
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),2600)}
const md=d=>(d.getMonth()+1)+'月'+d.getDate()+'日';
const wk0=d=>addDays(d,-((d.getDay()+6)%7));
const fromIso=s=>{const a=s.split('-');return new Date(+a[0],+a[1]-1,+a[2])};
function label(){const d=S.date;$('dl').textContent=(S.role==='staff'||S.view!=='day')?md(wk0(d))+'〜'+md(addDays(wk0(d),6)):md(d)+'（'+'日月火水木金土'[d.getDay()]+'）'}
function banner(){
 const role=S.admin?'管理者':'受付';
 const m={loading:'接続しています…',live:'接続中。予約はすべての端末にすぐ反映されます。',error:'サーバーとの接続が切れました。通信を確認して、ページを開き直してください。'}[S.mode]||'';
 $('mode').textContent=m+(S.mode==='loading'?'':'　ログイン：'+((ME&&ME.email)||'')+'（'+role+(S.admin?'':'・'+sname(S.store))+'）');
}
function pats(){return P.filter(p=>p.s===S.store).sort((a,b)=>(b.nw?1:0)-(a.nw?1:0))}
const kh=s=>String(s).normalize('NFKC').replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60)).replace(/[\s　]/g,'').toLowerCase();
const z0=s=>String(s).replace(/^0+(?=\d)/,'');
function sugg(){
 const q=kh(S.q),qn=/^\d+$/.test(q)?z0(q):null;
 const score=p=>{
  if(!q)return 5;
  const c=p.c?kh(p.c):'';
  if(c&&qn!==null){if(c===q||z0(c)===qn)return 0;if(c.startsWith(q)||z0(c).startsWith(qn))return 1;if(c.includes(q)||z0(c).includes(qn))return 2}
  const t=kh(p.n+p.k+c);
  if(t.includes(q))return kh(p.n).startsWith(q)||kh(p.k).startsWith(q)?3:4;
  return -1};
 const all=pats().map(p=>[score(p),p]).filter(x=>x[0]>=0).sort((a,b)=>a[0]-b[0]||(b[1].nw?1:0)-(a[1].nw?1:0));
 const list=all.slice(0,10).map(x=>x[1]);
 $('sug').innerHTML=list.length?list.map(p=>`<button class="btn" data-p="${esc(p.id)}">${esc(p.n)}${p.nw?'（新規）':''}${p.c?'<small style="font-weight:400"> No.'+esc(p.c)+'</small>':''}</button>`).join('')+(all.length>10?'<span class="note" style="margin:0;align-self:center">ほか'+(all.length-10)+'人。さらに絞り込んでください</span>':''):'<span class="empty">該当する患者さんがいません</span>';
}
const MK=[['j','実費'],['k','実費更新日'],['h','鍼'],['r','レセ（今月初診）'],['n','新規']];
function patient(){
 const p=P.find(x=>x.id===S.pid);
 const sig=[S.pid,p&&p.s,p&&p.nw,S.mk.j,S.mk.k,S.mk.h,S.mk.r,S.mk.n,S.mk.w,S.canW].join('|');
 if(sig===S.psig)return;S.psig=sig;
 if(!p){$('patient').innerHTML='';return}
 const others=STORES.filter(s=>s.id!==p.s).map(s=>`<option value="${s.id}">${s.name}</option>`).join('');
 $('patient').innerHTML=`<div class="panel"><div class="row"><strong>${esc(p.n)}さん</strong><span>通う店舗：${sname(p.s)}</span>
 <button class="btn p" id="again">1週間後の同じ枠で予約</button><button class="btn" id="clear">選択を解除</button></div>
 <div class="row" style="margin-top:8px">${MK.concat([['w','2枠（40分）']]).map(([f,l])=>`<label class="chk"><input type="checkbox" data-mk="${f}"${S.mk[f]?' checked':''}> ${l}</label>`).join('')}<span class="note" style="margin:0">この予約の目印</span></div>
 <div class="row" style="margin-top:8px"><label>通う店舗を変更 <select id="moveTo">${others}</select></label><button class="btn" id="move">変更する</button></div>
 ${p.nw?`<div class="row" style="margin-top:8px"><label>メープルの管理番号 <input id="lnum" class="fi" autocomplete="off" inputmode="numeric"></label><button class="btn" id="link">管理番号を登録</button></div><p>メープルの管理番号を登録すると、メープルの患者さんとして紐づきます（すでに同じ管理番号の方がいる場合は、予約もまとめられます）。</p>`:''}
 <p>下の表の空き枠をタップすると予約が入ります。店舗を変更しても、過去の予約は元の店舗に残ります。</p></div>`;
}
function detail(){
 const b=S.sel&&B[S.sel];
 if(!b){$('detail').innerHTML='';return}
 const pb=b.cont?B[b.cont]:b;

async function book(s,t,pid,date){
 const k=key(date,S.store,s,t);
 const st0=STORES.find(x=>x.id===S.store);
 if(!wr())return false;
 if(!isOpenDay(st0,date)){toast('その日は休診日です');return false}
 if(t<st0.first||t>st0.lastPm||isBreak(st0,t,date)){toast('その時間は受付時間外です');return false}
 if(B[k]){toast('その枠はすでに埋まっています');return false}
 if(isAbsent(S.store,date,s,t,st0)){toast('このスタッフは、その時間は欠勤に設定されています');return false}
 const two=!!S.mk.w&&s!=='q';
 const k2=key(date,S.store,s,t+20);
 if(two){
  if(t+20>st0.lastPm||isBreak(st0,t+20,date)){toast('2枠続けて取れません（営業時間の終わりか休憩に重なります）');return false}
  if(B[k2]){toast('次の枠がすでに埋まっています');return false}
 }
 const marks=Object.assign({},S.mk);delete marks.w;
 let id;
 try{id=await API.addAppt({store_id:S.store,appt_date:iso(date),lane:String(s),start_min:t,dur_min:s==='q'?10:(two?40:20),patient_id:pid,marks,source:'reception'})}
 catch(e){toast(errMsg(e,'予約を保存できませんでした。もう一度お試しください'));reload();return false}
 B[k]={pid,m:marks,span:two?2:1,id};
 if(two)B[k2]={pid,cont:k};
 S.mk={j:0,h:0,r:0,n:0};
 toast(pn(pid)+'さんを予約しました　'+fmt(t)+'　'+(s==='q'?'10分枠':lnm(st0,s)));
 return true;
}

 delete B[pk];

 return true;
}

function parseCsv(t){const r=[];let row=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===','){row.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);f='';r.push(row);row=[]}else f+=c}if(f!==''||row.length){row.push(f);r.push(row)}return r}
function decodeBuf(buf){try{return new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(e){return new TextDecoder('shift_jis').decode(buf)}}
const GYO=[['あ','あいうえおぁぃぅぇぉゔ'],['か','かきくけこ'],['さ','さしすせそ'],['た','たちつてとっ'],['な','なにぬねの'],['は','はひふへほ'],['ま','まみむめも'],['や','やゆよゃゅょ'],['ら','らりるれろ'],['わ','わをん']];
function gyoOf(p){
 const t=kh(p.k||'');if(!t)return '他';
 const c=t.normalize('NFD')[0];
 for(const [g,cs] of GYO)if(cs.includes(c))return g;
 return '他';
}
const PL={gy:'あ',n:200,sig:''};
function plRender(force){
 const el=$('plist');if(el.hidden)return;
 const list=pats(),sig=S.store+'|'+PL.gy+'|'+PL.n+'|'+list.length+'|'+list.map(p=>p.n+p.k+(p.c||'')).join('').length;
 if(!force&&sig===PL.sig)return;PL.sig=sig;
 const cnt={};list.forEach(p=>{const g=gyoOf(p);cnt[g]=(cnt[g]||0)+1});
 const tabs=GYO.map(x=>x[0]).concat(['他']);
 const rows=list.filter(p=>gyoOf(p)===PL.gy).sort((a,b)=>kh(a.k||a.n).localeCompare(kh(b.k||b.n),'ja'));
 const show=rows.slice(0,PL.n);
 el.innerHTML='<div class="row"><strong>患者一覧（'+esc(sname(S.store))+'・'+list.length+'人）</strong><button class="btn" id="plClose">閉じる</button></div>'
  +'<div class="row" style="margin:8px 0">'+tabs.map(g=>'<button class="btn" data-gy="'+g+'" aria-pressed="'+(g===PL.gy)+'" style="min-width:48px'+(g===PL.gy?';background:var(--pri);color:var(--pi);font-weight:700':'')+'">'+(g==='他'?'他':g+'行')+(cnt[g]?'<small style="font-weight:400"> '+cnt[g]+'</small>':'')+'</button>').join('')+'</div>'
  +(show.length?'<div style="display:grid;gap:6px;max-height:50vh;overflow:auto">'+show.map(p=>'<button class="btn" data-pl="'+esc(p.id)+'" style="text-align:left;display:flex;gap:12px;flex-wrap:wrap"><span style="min-width:8em">'+esc(p.n)+(p.nw?'（新規）':'')+'</span><span class="note" style="margin:0">'+esc(p.k||'')+'</span><span class="note" style="margin:0">'+(p.c?'No.'+esc(p.c):'')+'</span></button>').join('')+'</div>'+(rows.length>show.length?'<button class="btn" id="plMore" style="margin-top:8px">さらに表示（残り'+(rows.length-show.length)+'人）</button>':''):'<span class="empty">この行の患者さんはいません</span>');
}

$('csv').onchange=e=>{
 const file=e.target.files[0];if(!file)return;
 const rd=new FileReader();
 rd.onload=async()=>{
  const rows=parseCsv(decodeBuf(rd.result)).filter(r=>r.some(x=>x&&x.trim()));
  const h=(rows[0]||[]).map(x=>x.replace(/^﻿/,'').trim()),ci=n=>h.indexOf(n);
  const a=ci('管理番号'),b=ci('氏名'),c=ci('フリガナ');
  if(a<0||b<0){toast('「管理番号」と「氏名」の列が見つかりません');e.target.value='';return}
  if(!wr()){e.target.value='';return}
  const known={};P.forEach(p=>{if(p.c)known[p.c]=p});
  const add=[],upd=[],seen={};
  rows.slice(1).forEach(r=>{
   const num=(r[a]||'').trim(),nm=(r[b]||'').trim();if(!num||!nm||seen[num])return;seen[num]=1;
   const kn=c>=0?(r[c]||'').normalize('NFKC').trim():'',ex=known[num];
   if(ex){if(ex.n!==nm||(c>=0&&ex.k!==kn))upd.push([ex,nm,kn])}else add.push({kanri_no:num,name:nm,kana:kn,store_id:S.store});
  });
  toast('取り込み中です…');
  let res={ok:0,fail:0},uf=0;
  try{res=await API.insertPatients(add)}catch(x){toast('取り込めませんでした。もう一度お試しください');e.target.value='';return}
  for(const [ex,nm,kn] of upd){try{await API.updatePatientName(ex.id,nm,c>=0?kn:ex.k)}catch(x){uf++}}
  try{await loadPatients()}catch(x){}
  S.pid=null;S.sel=null;S.q='';$('q').value='';$('sug').innerHTML='';S.psig='';
  render();sugg();
  toast(sname(S.store)+'：新しく'+res.ok+'人を追加'+(upd.length-uf?'、'+(upd.length-uf)+'人を更新':'')+((res.fail+uf)?'（'+(res.fail+uf)+'人は取り込めませんでした）':''));
  e.target.value='';
 };
 rd.readAsArrayBuffer(file);
};

$('wst').onchange=e=>{S.ws=+e.target.value;S.sel=null;render()};
$('adminView').onclick=e=>{const b=e.target.closest('[data-day]');if(!b)return;S.date=fromIso(b.dataset.day);S.view='day';ensureRange();render()};

function showLogin(msg){$('app').hidden=true;$('login').hidden=false;$('lerr').textContent=msg||'';$('lgo').disabled=false}
$('lform').onsubmit=async e=>{
 e.preventDefault();$('lgo').disabled=true;$('lerr').textContent='';
 try{const u=await API.login($('le').value.trim(),$('lp').value);$('lp').value='';await boot(u)}
 catch(x){showLogin('メールアドレスかパスワードが違います')}
};
$('logout').onclick=async()=>{try{await API.logout()}catch(e){}location.reload()};
async function boot(user){
 ME=user;S.mode='loading';
 let pr;
 try{pr=await API.profile(user.id)}catch(e){showLogin('権限を読み込めませんでした。通信を確認してもう一度お試しください');return}
 if(!pr){await API.logout().catch(()=>{});showLogin('このアカウントには、まだ権限が登録されていません。管理者に連絡してください。');return}
 S.admin=pr.role==='admin';S.canW=true;
 try{
  const rows=await API.stores();STORES.length=0;rows.forEach(r=>STORES.push(norm(r)));
  (await API.holidays()).forEach(h=>{HOL[h.day]=h.name});
  await loadPatients();
 }catch(e){showLogin('データを読み込めませんでした。通信を確認してもう一度お試しください');return}
 let saved='';try{saved=localStorage.getItem('rsv_store')||''}catch(e){}
 S.store=S.admin?(STORES.some(s=>s.id===saved)?saved:STORES[0].id):pr.store_id;
 $('myStore').innerHTML=STORES.map(s=>`<option value="${s.id}">${s.name}</option>`).join('');
 $('myStore').value=S.store;
 S.role='staff';S.date=new Date();S.date.setHours(0,0,0,0);
 S.rf=iso(addDays(S.date,-60));S.rt=iso(addDays(S.date,120));
 $('login').hidden=true;$('app').hidden=false;
 render();sugg();
 await reload();
 API.subscribe(scheduleReload);
 setInterval(()=>{if(!document.hidden)reload()},30000);
}
async function init(){
 sb=supabase.createClient(SB_URL,SB_KEY);
 let u=null;try{u=await API.user()}catch(e){}
 if(u)boot(u);else showLogin('');
}
init();
</script>
</body>
</html>
